server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/seolytics_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration-ms: 86400000
  crawler:
    max-depth: 3
    connection-timeout-ms: 5000
    user-agent: SeolyticsBot/1.0 (+https://github.com/seolytics)
    selenium:
      headless: true
      driver-path: ""

logging:
  level:
    com.seolytics: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
