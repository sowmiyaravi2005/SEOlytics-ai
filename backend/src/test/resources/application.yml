spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:seolytics;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
seolytics:
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars
