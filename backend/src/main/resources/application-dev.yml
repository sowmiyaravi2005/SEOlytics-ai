server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:h2:file:./data/seolytics-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

seolytics:
  jwt:
    secret: dev-secret-key-must-be-at-least-32-chars-long
