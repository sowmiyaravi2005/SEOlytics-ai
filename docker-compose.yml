services:
  mysql:
    image: mysql:8.4
    container_name: seolytics-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: seolytics
      MYSQL_USER: seolytics
      MYSQL_PASSWORD: seolytics
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - seolytics-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  seolytics-mysql-data:
